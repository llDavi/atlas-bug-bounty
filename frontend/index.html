    <!-- The hand of the book: 17th-century printing (IM Fell), a scholarly
         body serif (EB Garamond), inscriptional caps (Cinzel), a marginal
         hand (Caveat) and a typewriter for pasted-in transcripts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;500;600&family=Caveat:wght@400;500&family=Courier+Prime:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      /* Stamp the light before first paint, so the page never flashes the
         wrong one. React's LampProvider takes over from here. */
      (function () {
        try {
          var kept = localStorage.getItem("codex-lamp");
          var night = kept === "night" ||
            (kept !== "day" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = night ? "night" : "day";
        } catch (e) {
          document.documentElement.dataset.theme = "day";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
